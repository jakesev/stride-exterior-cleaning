<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Articulate</title>
<meta name="description" content="A daily read, write and speak practice for becoming a clearer communicator.">
<meta name="theme-color" content="#F5F2FC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0B18" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Articulate">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,400..500&family=Inter:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  try { var t = localStorage.getItem('articulate.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--accent)"/>
      <stop offset="1" style="stop-color:var(--accent-2)"/>
    </linearGradient>
  </defs>
</svg>

<header class="topbar">
  <a class="brand" href="#/" aria-label="Articulate home">
    <span class="brand-mark">A</span>
    <span class="brand-name">Articulate</span>
  </a>
  <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch colour theme"></button>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabbar" aria-label="Main">
  <a href="#/" data-tab="">Today</a>
  <a href="#/toolkit" data-tab="toolkit">Toolkit</a>
  <a href="#/log" data-tab="log">Log</a>
  <a href="#/review" data-tab="review">Review</a>
</nav>

<div id="toast" role="status" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script src="app.js"></script>
</body>
</html>
