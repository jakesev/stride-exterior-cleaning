<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concept C — Tide</title>
<style>
@font-face{font-family:Fraunces;src:url(fonts/fraunces.woff2) format('woff2');font-weight:300 700}
@font-face{font-family:Figtree;src:url(fonts/figtree.woff2) format('woff2');font-weight:400 700}
:root{--ink:#061426;--blue:#0076D1;--mist:#eaf4fb}
*{box-sizing:border-box;margin:0}
body{font-family:Figtree,sans-serif;color:var(--ink);background:#fff}
header{display:flex;justify-content:space-between;align-items:center;padding:24px 56px;position:relative;z-index:3}
header img{height:34px}
nav{display:flex;gap:30px;font-size:15px;font-weight:500;background:rgba(255,255,255,.75);padding:12px 26px;border-radius:99px}
.btn{background:var(--ink);color:#fff;border-radius:99px;padding:15px 26px;font-weight:600;font-size:15px;text-decoration:none;display:inline-block}
.btn.light{background:#fff;color:var(--ink);box-shadow:0 8px 30px rgba(6,20,38,.08)}
.hero{position:relative;min-height:calc(100vh - 86px);background:linear-gradient(180deg,#f2f8fd 0%,#fff 75%);overflow:hidden;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;padding:0 56px}
.ribbon{position:absolute;inset:-10% -5% auto -5%;width:110%;height:120%;z-index:0}
.copy{position:relative;z-index:2}
h1{font-family:Fraunces,serif;font-weight:360;font-size:clamp(52px,6.2vw,96px);line-height:1;letter-spacing:-.025em;font-variation-settings:"opsz" 144}
h1 em{font-style:normal;color:var(--blue)}
p.lede{font-size:20px;line-height:1.55;color:#38475a;max-width:28em;margin:26px 0 34px}
.arch{position:relative;z-index:2;justify-self:end;width:min(36vw,520px);aspect-ratio:3/4;border-radius:999px 999px 28px 28px;overflow:hidden;box-shadow:0 40px 80px -30px rgba(6,40,80,.35)}
.arch img{width:100%;height:100%;object-fit:cover}
.chip{position:absolute;z-index:3;right:min(30vw,440px);bottom:14%;background:#fff;border-radius:22px;padding:18px 20px;box-shadow:0 20px 50px -10px rgba(6,20,38,.18);font-size:14px;width:250px}
.chip b{font-family:Fraunces,serif;font-size:30px;font-weight:400;display:block}
</style></head><body>
<header><img src="../../assets/brand/stride-logo-primary.svg" alt="Stride"><nav><a>Services</a><a>Our work</a><a>Guides</a><a>Areas</a></nav><a class="btn">Free quote</a></header>
<section class="hero">
  <svg class="ribbon" viewBox="0 0 1440 1000" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#cfe6f8"/><stop offset=".55" stop-color="#7cbcec" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs>
    <path d="M-40 640 C 220 520 360 760 640 660 S 1040 380 1500 520 L1500 600 C 1060 470 900 760 640 780 S 200 640 -40 760 Z" fill="url(#g)"/>
    <path d="M-40 700 C 260 600 420 820 700 720 S 1100 460 1500 600" fill="none" stroke="#0076D1" stroke-opacity=".25" stroke-width="1.5"/>
  </svg>
  <div class="copy">
    <h1>Bring your home<br>back to the <em>light.</em></h1>
    <p class="lede">Gentle, thorough exterior cleaning for bayside homes — from salt-hazed windows to mould-dark driveways.</p>
    <a class="btn">Get a free quote</a> <a class="btn light">See the results</a>
  </div>
  <div class="arch"><img src="img/area-bay-960.webp" alt=""></div>
  <div class="chip"><b>Redlands</b>Coast &amp; hinterland, Cleveland to Mount Cotton</div>
</section>
</body></html>
